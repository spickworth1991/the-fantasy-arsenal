name: Freeze pre-kickoff projections

on:
  workflow_dispatch:
    inputs:
      season:
        description: NFL season override (optional)
        required: false
        type: string
  schedule:
    # Windows cover standard and holiday NFL kickoffs in both daylight and
    # standard time. The script exits without writing unless a real saved game
    # is within three hours, so empty windows do not create commits.
    - cron: "30 15,19,22,23 * 9-12,1 2-5"
    - cron: "30 15,19,22 * 9-12,1 6"
    - cron: "15 15,16 * 9-12,1 0"
    - cron: "30 18,19,22,23 * 9-12,1 0"
    - cron: "30 22,23 * 9-12,1 1"

concurrency:
  group: daily-values-and-projections
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Capture only when kickoff is near
        shell: bash
        run: |
          if [ -n "${{ inputs.season }}" ]; then
            node --no-warnings ./scripts/capturePreKickoffSnapshot.js --season=${{ inputs.season }}
          else
            node --no-warnings ./scripts/capturePreKickoffSnapshot.js
          fi

      - name: Commit immutable snapshot and audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No kickoff was in the capture window."
            exit 0
          fi
          git commit -m "chore: freeze pre-kickoff projections $(date -u +%FT%H:%MZ)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
