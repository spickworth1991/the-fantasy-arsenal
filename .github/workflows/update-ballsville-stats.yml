name: Update Ballsville statistics

on:
  workflow_dispatch:
  schedule:
    # Every three hours during the primary fantasy draft season (May–September).
    - cron: "17 */3 * 5-9 *"

concurrency:
  group: ballsville-statistics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build cached Ballsville statistics
        run: npm run update:ballsville-stats
      - name: Commit refreshed cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ballsville-stats-*.json public/data/player-stock-drafters-*.json
          if git diff --cached --quiet; then
            echo "No Ballsville statistic changes to commit."
            exit 0
          fi
          git commit -m "chore: update Ballsville statistics $(date -u +%FT%H:%MZ)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
