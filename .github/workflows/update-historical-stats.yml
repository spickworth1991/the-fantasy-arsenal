name: Update saved historical statistics

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season to build (leave blank for the previous NFL season)
        required: false
        type: string
      full_backfill:
        description: Resume every missing season from 2012 forward
        required: false
        default: false
        type: boolean

concurrency:
  group: historical-statistics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build saved historical data
        shell: bash
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          FANTASYPROS_MIN_INTERVAL_MS: 7000
          FANTASYPROS_RUN_BUDGET: 100
          REQUESTED_SEASON: ${{ inputs.season }}
          FULL_BACKFILL: ${{ inputs.full_backfill }}
        run: |
          if [ "$FULL_BACKFILL" = "true" ]; then
            npm run update:stats -- --all
          elif [ -n "$REQUESTED_SEASON" ]; then
            npm run update:stats -- --season="$REQUESTED_SEASON"
          else
            npm run update:stats
          fi

      - name: Commit saved historical data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stats/history
          if git diff --cached --quiet; then
            echo "No historical data changed."
            exit 0
          fi
          git commit -m "chore: update historical fantasy statistics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
