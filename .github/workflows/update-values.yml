name: Daily values and projections

on:
  workflow_dispatch:
    inputs:
      verbose_logs:
        description: Show detailed browser and per-request diagnostics
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-values-and-projections
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update values and projections
        run: npm run update:daily
        env:
          UPDATE_VERBOSE: ${{ inputs.verbose_logs && '1' || '0' }}
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}

      - name: Upload Stat Central archives to Arsenal R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "R2 credentials are not configured; keeping the GitHub public-data fallback."
            exit 0
          fi
          aws s3 sync public/stats/derived "s3://${R2_BUCKET}/stats" --endpoint-url "$R2_ENDPOINT" --no-progress

      - name: Commit updated data and archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No value or projection changes to commit."
            exit 0
          fi
          git commit -m "chore: update values and projections $(date -u +%F)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
