name: Daily values and projections

on:
  workflow_dispatch:

concurrency:
  group: daily-values-and-projections
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update values and projections
        run: npm run update:daily

      - name: Commit updated data and archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No value or projection changes to commit."
            exit 0
          fi
          git commit -m "chore: update values and projections $(date -u +%F)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
